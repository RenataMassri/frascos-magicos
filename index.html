<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Frascos Mágicos ✨</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a1c4fd, #c2e9fb);
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            color: #333;
            overflow: hidden;
        }
        h1 {
            font-size: 3em;
            margin: 20px;
            text-shadow: 3px 3px 0 #fff;
            color: #ff6bcb;
        }
        .frascos-pequenos {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
            margin: 20px auto;
        }
        .frasco {
            width: 85px;
            height: 115px;
            border-radius: 20px 20px 10px 10px;
            border: 8px solid #333;
            cursor: pointer;
            position: relative;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2em;
        }
        .frasco.usado {
            opacity: 0.3;
            transform: scale(0.8);
            pointer-events: none;
        }
        .frasco:active { transform: scale(1.4) rotate(15deg); }

        /* 10 colores */
        .frasco1 { background: linear-gradient(#ff0088, #ff88cc); }
        .frasco2 { background: linear-gradient(#00ffcc, #88ffee); }
        .frasco3 { background: linear-gradient(#ffdd00, #ffee88); }
        .frasco4 { background: linear-gradient(#4488ff, #88aaff); }
        .frasco5 { background: linear-gradient(#ff6600, #ffaa77); }
        .frasco6 { background: linear-gradient(#9900ff, #cc88ff); }
        .frasco7 { background: linear-gradient(#00ff44, #88ff99); }
        .frasco8 { background: linear-gradient(#ff3366, #ff99aa); }
        .frasco9 { background: linear-gradient(#ff8800, #ffbb66); }
        .frasco10 { background: linear-gradient(#00aaff, #77ddff); }

        .frasco-vacio {
            width: 190px;
            height: 240px;
            border-radius: 45px 45px 25px 25px;
            border: 18px solid #333;
            background: rgba(255,255,255,0.25);
            margin: 30px auto;
            position: relative;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            overflow: hidden;
        }
        .frasco-vacio .liquido {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            transition: height 0.4s ease;
            border-radius: 0 0 20px 20px;
        }
        .frasco-vacio .regaloDentro {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5em;
            opacity: 0;
            transition: all 0.6s;
            z-index: 10;
        }

        .humo {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            opacity: 0;
        }
        .humo div {
            position: absolute;
            background: rgba(255,255,255,0.75);
            border-radius: 50%;
            filter: blur(10px);
            animation: humoAnim 1.8s forwards;
        }

        @keyframes humoAnim {
            0% { transform: scale(0.3) translateY(20px); opacity: 0.9; }
            100% { transform: scale(2) translateY(-180px); opacity: 0; }
        }

        button {
            font-size: 1.6em;
            padding: 15px 35px;
            margin: 15px;
            border: none;
            border-radius: 50px;
            background: #ff6bcb;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 0 #c93a8a;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #c93a8a;
        }

        .inventario {
            margin: 30px auto;
            max-width: 900px;
            background: rgba(255,255,255,0.8);
            border-radius: 30px;
            padding: 20px;
        }
        .item-inventario {
            display: inline-block;
            font-size: 3.2em;
            margin: 8px;
            padding: 10px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .estrella {
            position: absolute;
            font-size: 2.5em;
            animation: flotar 2.5s infinite linear;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <h1>✨ Frascos Mágicos del Arcoíris ✨</h1>
    <p style="font-size:1.6em;">¡Toca cada frasquito para agregar su magia!</p>

    <div class="frascos-pequenos" id="frascos">
        <div class="frasco frasco1" data-color="1">🌸</div>
        <div class="frasco frasco2" data-color="2">🦋</div>
        <div class="frasco frasco3" data-color="3">⭐</div>
        <div class="frasco frasco4" data-color="4">🐬</div>
        <div class="frasco frasco5" data-color="5">🍭</div>
        <div class="frasco frasco6" data-color="6">🦄</div>
        <div class="frasco frasco7" data-color="7">🌺</div>
        <div class="frasco frasco8" data-color="8">🍓</div>
        <div class="frasco frasco9" data-color="9">🌈</div>
        <div class="frasco frasco10" data-color="10">🧚</div>
    </div>

    <!-- Frasco grande -->
    <div>
        <div class="frasco-vacio" id="frascoGrande">
            <div class="liquido" id="liquido"></div>
            <div class="humo" id="humo"></div>
            <div class="regaloDentro" id="regaloDentro">🪄</div>
            <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:4em; opacity:0.3; z-index:5;" id="emojiGrande">🪄</div>
        </div>
        <p style="font-size:1.4em;">¡Toca los frasquitos de abajo!</p>
    </div>

    <!-- Botones cuando aparece el regalo -->
    <div id="zonaRegalo" style="display:none; margin:30px;">
        <h2 style="color:#ff00aa;">¡MÁGIA! ✨🌈</h2>
        <div style="font-size:6em; margin:20px;" id="regaloGrande"></div>
        <p id="regaloNombre" style="font-size:2.3em; margin:10px;"></p>
        
        <button onclick="guardarRegalo()">💖 ¡Me encanta! Guardar</button>
        <button onclick="descartarRegalo()" style="background:#777;">😕 Otro regalo</button>
    </div>

    <!-- Inventario -->
    <div class="inventario">
        <h2>🌟 Mi Tesoro Mágico 🌟</h2>
        <div id="inventarioItems"></div>
    </div>

    <script>
        let combinados = 0;
        let inventario = [];
        
        const regalos = [
            {emoji: "🏠", nombre: "Casita de ensueño"},
            {emoji: "🍳", nombre: "Cocinita mágica"},
            {emoji: "🧺", nombre: "Lavarropita rosa"},
            {emoji: "👗", nombre: "Vestidito de princesa"},
            {emoji: "🧸", nombre: "Osito abrazos"},
            {emoji: "🛏️", nombre: "Cama con luces"},
            {emoji: "🪄", nombre: "Varita de hada"},
            {emoji: "🍰", nombre: "Torta arcoíris"},
            {emoji: "🚗", nombre: "Autito brillante"},
            {emoji: "🌈", nombre: "Arcoíris de peluche"},
            {emoji: "🧁", nombre: "Set de cupcakes"},
            {emoji: "🪩", nombre: "Espejo mágico"}
        ];

        // Hacer clic en los frascos pequeños
        document.querySelectorAll('.frasco').forEach(frasco => {
            frasco.addEventListener('click', () => {
                if (frasco.classList.contains('usado')) return;
                
                frasco.classList.add('usado');
                combinados++;
                
                // Llenar líquido
                const porcentaje = (combinados / 10) * 100;
                document.getElementById("liquido").style.height = porcentaje + "%";
                document.getElementById("liquido").style.background = `linear-gradient(45deg, #ff00ff, #00ffff, #ffff00, #ff00ff)`;

                if (combinados >= 10) {
                    activarMagia();
                }
            });
        });

        function activarMagia() {
            // Humo rápido
            const humoContainer = document.getElementById("humo");
            humoContainer.style.opacity = "1";
            humoContainer.innerHTML = "";

            for (let i = 0; i < 20; i++) {
                const p = document.createElement("div");
                const size = Math.random() * 50 + 25;
                p.style.width = size + "px";
                p.style.height = size + "px";
                p.style.left = Math.random() * 100 + "%";
                p.style.bottom = "10%";
                p.style.animationDelay = (Math.random() * 0.8) + "s";
                humoContainer.appendChild(p);
            }

            // Mostrar regalo DENTRO del frasco
            setTimeout(() => {
                const regalo = regalos[Math.floor(Math.random() * regalos.length)];
                const regaloDentro = document.getElementById("regaloDentro");
                regaloDentro.textContent = regalo.emoji;
                regaloDentro.style.opacity = "1";
                regaloDentro.style.transform = "translate(-50%, -50%) scale(1.2)";

                // También mostrar la zona con botones
                document.getElementById("regaloGrande").textContent = regalo.emoji;
                document.getElementById("regaloNombre").textContent = regalo.nombre;
                document.getElementById("zonaRegalo").style.display = "block";

                crearEstrellas();
            }, 900);
        }

        function crearEstrellas() {
            for(let i = 0; i < 35; i++) {
                const estrella = document.createElement("div");
                estrella.textContent = ["✨","⭐","🌟","💖"][Math.floor(Math.random()*4)];
                estrella.className = "estrella";
                estrella.style.left = Math.random() * 100 + "vw";
                estrella.style.top = (50 + Math.random() * 30) + "vh";
                estrella.style.animationDuration = (Math.random() * 2 + 2) + "s";
                document.body.appendChild(estrella);
                setTimeout(() => estrella.remove(), 5000);
            }
        }

        function guardarRegalo() {
            const emoji = document.getElementById("regaloGrande").textContent;
            inventario.push(emoji);
            actualizarInventario();
            reiniciar();
        }

        function descartarRegalo() {
            reiniciar();
        }

        function actualizarInventario() {
            const cont = document.getElementById("inventarioItems");
            cont.innerHTML = "";
            inventario.forEach(item => {
                const div = document.createElement("div");
                div.className = "item-inventario";
                div.textContent = item;
                cont.appendChild(div);
            });
        }

        function reiniciar() {
            combinados = 0;
            document.getElementById("zonaRegalo").style.display = "none";
            document.getElementById("liquido").style.height = "0%";
            document.getElementById("humo").style.opacity = "0";
            document.getElementById("humo").innerHTML = "";
            document.getElementById("regaloDentro").style.opacity = "0";
            
            // Reactivar todos los frascos
            document.querySelectorAll('.frasco').forEach(f => {
                f.classList.remove('usado');
            });
        }
    </script>
</body>
</html>
