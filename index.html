<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✨ Frascos Mágicos ✨</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 8px;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a1c4fd, #c2e9fb);
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            color: #333;
            min-height: 100vh;
            overflow-y: auto;
        }

        /* 🔥 ESTO ES LO NUEVO: fuerza emojis coloridos */
        .emoji {
            font-family: "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", 
                        "Noto Color Emoji", "EmojiOne Color", "Android Emoji", sans-serif;
            font-variant-emoji: emoji; /* fuerza versión color */
        }

        h1 { font-size: 2.2em; margin: 10px 0 8px; color: #ff6bcb; }
        p { font-size: 1.3em; margin: 5px 0 15px; }

        .frascos-pequenos {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 10px 0;
        }
        .frasco {
            width: 65px;
            height: 88px;
            border-radius: 16px 16px 7px 7px;
            border: 6px solid #333;
            cursor: pointer;
            box-shadow: 0 6px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.9em;
            transition: all 0.2s;
        }
        .frasco:active { transform: scale(1.3) rotate(15deg); }
        .frasco.usado { opacity: 0.3; transform: scale(0.7); pointer-events: none; }

        .frasco-vacio {
            width: 155px;
            height: 195px;
            border-radius: 35px 35px 20px 20px;
            border: 14px solid #333;
            background: rgba(255,255,255,0.3);
            margin: 15px auto;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .liquido {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 0%;
            transition: height 0.4s;
            border-radius: 0 0 15px 15px;
        }
        .regaloDentro {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4.2em;
        }

        button {
            font-size: 1.4em;
            padding: 12px 28px;
            margin: 8px;
            border-radius: 50px;
            border: none;
            background: #ff6bcb;
            color: white;
        }
        button:active { transform: translateY(3px); }

        .inventario { margin: 20px auto; padding: 12px; background: rgba(255,255,255,0.8); border-radius: 20px; }
        .item-inventario { font-size: 2.6em; margin: 5px; display: inline-block; }
    </style>
</head>
<body>

    <h1>✨ Frascos Mágicos ✨</h1>
    <p>Toca los 10 frasquitos</p>

    <div class="frascos-pequenos" id="frascos">
        <div class="frasco frasco1 emoji" data-color="1">🌸</div>
        <div class="frasco frasco2 emoji" data-color="2">🦋</div>
        <div class="frasco frasco3 emoji" data-color="3">⭐</div>
        <div class="frasco frasco4 emoji" data-color="4">🐬</div>
        <div class="frasco frasco5 emoji" data-color="5">🍭</div>
        <div class="frasco frasco6 emoji" data-color="6">🦄</div>
        <div class="frasco frasco7 emoji" data-color="7">🌺</div>
        <div class="frasco frasco8 emoji" data-color="8">🍓</div>
        <div class="frasco frasco9 emoji" data-color="9">🌈</div>
        <div class="frasco frasco10 emoji" data-color="10">🧚</div>
    </div>

    <div class="frasco-vacio" id="frascoGrande">
        <div class="liquido" id="liquido"></div>
        <div class="humo" id="humo"></div>
        <div class="regaloDentro emoji" id="regaloDentro">🪄</div>
    </div>

    <div id="zonaRegalo" style="display:none;">
        <h2 style="color:#ff00aa;">¡MÁGIA! ✨</h2>
        <div class="emoji" style="font-size:5.2em; margin:10px 0;" id="regaloGrande"></div>
        <p id="regaloNombre" style="font-size:1.8em;"></p>
        
        <button onclick="guardarRegalo()">💖 ¡Me encanta!</button>
        <button onclick="descartarRegalo()" style="background:#777;">😕 Otro</button>
    </div>

    <div class="inventario">
        <h2>🌟 Mi Tesoro 🌟</h2>
        <div id="inventarioItems"></div>
    </div>

    <script>
        let combinados = 0;
        let inventario = [];
        
        const regalos = [
            {emoji: "🏠", nombre: "Casita de ensueño"},
            {emoji: "🍳", nombre: "Cocinita mágica"},
            {emoji: "🧺", nombre: "Lavarropita rosa"},
            {emoji: "👗", nombre: "Vestidito de princesa"},
            {emoji: "🧸", nombre: "Osito abrazos"},
            {emoji: "🛏️", nombre: "Cama con luces"},
            {emoji: "🪄", nombre: "Varita de hada"},
            {emoji: "🍰", nombre: "Torta arcoíris"},
            {emoji: "🚗", nombre: "Autito brillante"},
            {emoji: "🌈", nombre: "Arcoíris de peluche"}
        ];

        document.querySelectorAll('.frasco').forEach(frasco => {
            frasco.addEventListener('click', () => {
                if (frasco.classList.contains('usado')) return;
                frasco.classList.add('usado');
                combinados++;
                
                document.getElementById("liquido").style.height = (combinados * 10) + "%";
                document.getElementById("liquido").style.background = "linear-gradient(45deg, #ff00ff, #00ffff, #ffff00)";

                if (combinados >= 10) activarMagia();
            });
        });

        function activarMagia() {
            const humo = document.getElementById("humo");
            humo.style.opacity = "1";
            humo.innerHTML = "";
            for (let i = 0; i < 15; i++) {
                const p = document.createElement("div");
                p.style.cssText = `position:absolute; width:${25+Math.random()*35}px; height:${25+Math.random()*35}px; left:${Math.random()*100}%; bottom:10%; background:rgba(255,255,255,0.8); border-radius:50%; filter:blur(6px); animation:humoAnim 1.6s forwards; animation-delay:${Math.random()}s;`;
                humo.appendChild(p);
            }

            setTimeout(() => {
                const r = regalos[Math.floor(Math.random()*regalos.length)];
                document.getElementById("regaloDentro").textContent = r.emoji;
                document.getElementById("regaloGrande").textContent = r.emoji;
                document.getElementById("regaloNombre").textContent = r.nombre;
                document.getElementById("zonaRegalo").style.display = "block";
            }, 700);
        }

        function guardarRegalo() {
            inventario.push(document.getElementById("regaloGrande").textContent);
            document.getElementById("inventarioItems").innerHTML = inventario.map(e => `<span class="emoji item-inventario">${e}</span>`).join('');
            reiniciar();
        }
        function descartarRegalo() { reiniciar(); }

        function reiniciar() {
            combinados = 0;
            document.getElementById("zonaRegalo").style.display = "none";
            document.getElementById("liquido").style.height = "0%";
            document.getElementById("humo").style.opacity = "0";
            document.getElementById("regaloDentro").textContent = "🪄";
            document.querySelectorAll('.frasco').forEach(f => f.classList.remove('usado'));
        }

        // Animación del humo
        const style = document.createElement('style');
        style.innerHTML = `@keyframes humoAnim { to { transform: translateY(-160px) scale(1.6); opacity: 0; } }`;
        document.head.appendChild(style);
    </script>
</body>
</html>
